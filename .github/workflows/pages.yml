name: Update GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh exchange rates
        shell: bash
        run: |
          set -euo pipefail

          refresh_rates() {
            local url="$1"
            local source="$2"
            local response_file
            response_file="$(mktemp)"

            if curl --fail --silent --show-error --location --max-time 20 \
              "$url" --output "$response_file" \
              && jq -e '.rates and (.rates.USD == 1)' "$response_file" >/dev/null; then
              jq --arg source "$source" \
                '{source: $source, updatedAt: (now | todateiso8601), rates: .rates}' \
                "$response_file" > public/rates.json
              rm -f "$response_file"
              return 0
            fi

            rm -f "$response_file"
            return 1
          }

          refresh_rates \
            "https://api.exchangerate.fun/latest?base=USD" \
            "ExchangeRate.fun" \
            || refresh_rates \
              "https://api.exchangerate-api.com/v4/latest/USD" \
              "ExchangeRate-API V4" \
            || echo "Using the bundled fallback exchange rates."

      - name: Publish static branch
        shell: bash
        run: |
          set -euo pipefail

          pages_dir="${RUNNER_TEMP}/vps-remaining-value-pages"
          git fetch origin gh-pages
          git worktree add "$pages_dir" origin/gh-pages
          rsync --archive --delete --exclude=".git" public/ "$pages_dir/"

          git -C "$pages_dir" config user.name "github-actions[bot]"
          git -C "$pages_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$pages_dir" add --all

          if git -C "$pages_dir" diff --cached --quiet; then
            echo "The published site is already current."
          else
            git -C "$pages_dir" commit -m "Update published site"
            git -C "$pages_dir" push origin HEAD:gh-pages
          fi
